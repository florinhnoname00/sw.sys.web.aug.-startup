<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web AR Gratuit</title>
  <!-- Script gratuit Google Model-Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    model-viewer { width: 100%; height: 100%; background-color: #f4f4f4; }
  </style>
</head>
<body>

  <model-viewer 
    src="model.glb" 
    ios-src="model.usdz" 
    alt="Model 3D Web AR" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    shadow-intensity="1" 
    auto-rotate>
    
    <button slot="ar-button" style="position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
      Deschide în AR
    </button>
    
  </model-viewer>

</body>
</html>
