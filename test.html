<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ainiere 3D cu Avertisment de Poziție</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #121212; }
    
    /* Caseta de status/warning */
    #status-box {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .warning {
      background-color: #d9534f;
      color: white;
      border: 1px solid #b52b27;
    }
    .success {
      background-color: #28a745;
      color: white;
      border: 1px solid #1e7e34;
    }

    #info {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      color: #aaa; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 6px; font-size: 12px;
    }

    #ar-button {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      border: 0; border-radius: 8px; padding: 12px 16px;
      color: white; background: #1677ff; font: 600 14px system-ui, sans-serif;
      cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.35);
    }
    #ar-button:disabled { cursor: not-allowed; opacity: 0.55; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="status-box" class="warning">⚠️ Poziție incorectă! Potrivește obiectul peste cadru.</div>
  <button id="ar-button" type="button">Pornește AR</button>
  <div id="info">Trage obiectul cu mouse-ul/degetul pentru a-l suprapune.</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { DragControls } from 'three/addons/controls/DragControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 2. Modelul Țintă (Poziția fixă unde trebuie potrivit obiectul)
    const targetGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const targetMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, wireframe: true });
    const targetModel = new THREE.Mesh(targetGeo, targetMat);
    targetModel.position.set(0, 0, 0); // Poziția de referință
    scene.add(targetModel);

    // 3. Obiectul Mobil (Obiectul tău scanat/filmat)
    const mobileGeo = new THREE.BoxGeometry(1.4, 1.4, 1.4);
    const mobileMat = new THREE.MeshStandardMaterial({ color: 0xffa500, transparent: true, opacity: 0.85 });
    const mobileObject = new THREE.Mesh(mobileGeo, mobileMat);
    mobileObject.position.set(-2.5, 0, 0); // Începe dezaxat
    scene.add(mobileObject);

    /* 
    // NOTĂ: După ce descarci fișierul tău model.glb, înlocuiești `mobileObject` de mai sus cu:
    const loader = new GLTFLoader();
    loader.load('modelul_tau.glb', (gltf) => {
      const myModel = gltf.scene;
      myModel.position.set(-2.5, 0, 0);
      scene.add(myModel);
      dragControls.getObjects().push(myModel);
    });
    */

    // 4. Controale și Calcul Distanță
    const orbitControls = new OrbitControls(camera, renderer.domElement);
    const dragControls = new DragControls([mobileObject], camera, renderer.domElement);
    const statusBox = document.getElementById('status-box');
    const arButton = document.getElementById('ar-button');
    const info = document.getElementById('info');
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let arSession = null;

    const TOLERANTA = 0.4; // Distanța maximă acceptată în unități 3D

    function updateAlignment() {
      const distanta = mobileObject.position.distanceTo(targetModel.position);

      if (distanta <= TOLERANTA) {
        statusBox.className = 'success';
        statusBox.textContent = '✅ Poziționare corectă!';
        mobileObject.material.color.setHex(0x28a745);
      } else {
        statusBox.className = 'warning';
        statusBox.textContent = '⚠️ Poziție incorectă! Ajustează alinierea.';
        mobileObject.material.color.setHex(0xffa500);
      }
    }

    dragControls.addEventListener('dragstart', () => {
      orbitControls.enabled = false;
    });

    dragControls.addEventListener('drag', () => {
      // Calculăm distanța 3D directă dintre centrul obiectului și țintă
      updateAlignment();
    });

    async function startAR() {
      if (!navigator.xr) {
        statusBox.textContent = 'AR nu este disponibil în acest browser.';
        return;
      }

      try {
        arSession = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });
        renderer.xr.setReferenceSpaceType('local');
        renderer.xr.setSession(arSession);
        arSession.addEventListener('end', () => {
          hitTestSource = null;
          hitTestSourceRequested = false;
          arSession = null;
          arButton.textContent = 'Pornește AR';
          info.textContent = 'Trage obiectul cu mouse-ul/degetul pentru a-l suprapune.';
        });
        arButton.textContent = 'Închide AR';
        info.textContent = 'Mișcă telefonul pentru a detecta o suprafață, apoi atinge pentru plasare.';
      } catch (error) {
        statusBox.textContent = 'Nu s-a putut porni AR. Folosește HTTPS și un browser compatibil.';
        console.error(error);
      }
    }

    arButton.addEventListener('click', async () => {
      if (arSession) {
        await arSession.end();
      } else {
        await startAR();
      }
    });

    if (!navigator.xr) {
      arButton.disabled = true;
      arButton.title = 'WebXR nu este disponibil';
    } else {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        arButton.disabled = !supported;
        if (!supported) arButton.title = 'Acest dispozitiv nu acceptă immersive-ar';
      });
    }

    dragControls.addEventListener('dragend', () => {
      orbitControls.enabled = true;
      
      // Auto-snap (lipire automată la centru când ești suficient de aproape)
      const distanta = mobileObject.position.distanceTo(targetModel.position);
      if (distanta <= TOLERANTA) {
        mobileObject.position.copy(targetModel.position);
      }
    });

    renderer.xr.addEventListener('sessionstart', () => {
      orbitControls.enabled = false;
      dragControls.enabled = false;
    });

    renderer.xr.addEventListener('sessionend', () => {
      orbitControls.enabled = true;
      dragControls.enabled = true;
    });

    renderer.setAnimationLoop(() => {
      if (renderer.xr.isPresenting) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();
        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((space) => {
            session.requestHitTestSource({ space }).then((source) => {
              hitTestSource = source;
            });
          });
          hitTestSourceRequested = true;
        }
        const frame = renderer.xr.getFrame();
        if (frame && hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0) {
            const pose = results[0].getPose(referenceSpace);
            targetModel.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            if (!mobileObject.userData.placed) {
              mobileObject.position.copy(targetModel.position);
              mobileObject.userData.placed = true;
              updateAlignment();
            }
          }
        }
      }
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
